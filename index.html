<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算機・極</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --warning: #ffc107; --danger: #dc3545; }
        body { font-family: sans-serif; background-color: #f8f9fa; padding: 15px; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; font-size: 1.4em; color: #222; }
        .section { margin-bottom: 18px; padding: 12px; border: 1px solid #edf2f7; border-radius: 12px; background: #fff; }
        .section-title { font-weight: bold; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 12px; display: block; font-size: 0.95em; }
        label { display: block; margin-top: 8px; font-size: 0.85em; color: #718096; }
        .select-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        select { flex: 1; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; background-color: #fff; -webkit-appearance: none; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-calc { background-color: var(--primary); color: white; margin-top: 10px; }
        .btn-calc:active { background-color: #0056b3; transform: scale(0.98); }
        
        .cumul-box { background: #fffaf0; border: 2px solid #feebc8; border-radius: 12px; padding: 15px; margin-top: 20px; }
        .cumul-title { text-align: center; font-weight: bold; color: #9c4221; margin-bottom: 10px; border-bottom: 1px solid #feebc8; padding-bottom: 5px; }
        .row { display: flex; justify-content: space-between; padding: 4px 0; font-weight: bold; color: #7b341e; }
        .total-row { font-size: 1.4em; color: var(--danger); border-top: 2px solid #feebc8; margin-top: 8px; padding-top: 8px; }
        
        .history { margin-top: 15px; font-size: 0.8em; color: #4a5568; max-height: 120px; overflow-y: auto; background: #edf2f7; border-radius: 8px; padding: 10px; }
        .history-item { border-bottom: 1px solid #cbd5e0; padding: 4px 0; display: flex; justify-content: space-between; }
        .btn-reset { background: none; color: var(--danger); font-size: 0.8em; text-decoration: underline; margin-top: 15px; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>勤務時間計算機</h2>

    <div class="section">
        <span class="section-title">1. 出退勤時間</span>
        <label>出勤時間</label>
        <div class="select-row">
            <select id="sh"></select>時 <select id="sm"></select>分
        </div>
        <label>退勤時間</label>
        <div class="select-row">
            <select id="eh"></select>時 <select id="em"></select>分
        </div>
    </div>

    <div class="section">
        <span class="section-title">2. 休憩時間</span>
        <label>17:00までの休憩</label>
        <select id="b1">
            <option value="0">なし</option>
            <option value="0.5">0.5時間 (30分)</option>
            <option value="1.0">1.0時間 (60分)</option>
        </select>
        <label>17:00からの休憩</label>
        <select id="b2">
            <option value="0">なし</option>
            <option value="0.5">0.5時間 (30分)</option>
            <option value="1.0">1.0時間 (60分)</option>
        </select>
    </div>

    <button class="btn-calc" onclick="run()">計算して累積に追加</button>

    <div class="cumul-box">
        <div class="cumul-title">📊 累積合計</div>
        <div class="row"><span>5:00 ～ 17:00:</span><span id="g1">0.00 時間</span></div>
        <div class="row"><span>17:00 ～ 0:00:</span><span id="g2">0.00 時間</span></div>
        <div class="row total-row"><span>総合計時間:</span><span id="gt">0.00 時間</span></div>
        
        <div class="history" id="hist">履歴はまだありません</div>
    </div>

    <button class="btn-reset" onclick="reset()">データをすべてリセット</button>
</div>

<script>
let acc1 = 0, acc2 = 0;

// セレクトボックス初期化
function init() {
    const sh = document.getElementById('sh'), eh = document.getElementById('eh');
    const sm = document.getElementById('sm'), em = document.getElementById('em');
    for(let i=0; i<24; i++) {
        let o = new Option(i.toString().padStart(2,'0'), i);
        sh.add(o.cloneNode(true)); eh.add(o);
    }
    [0, 15, 30, 45].forEach(m => {
        let o = new Option(m.toString().padStart(2,'0'), m);
        sm.add(o.cloneNode(true)); em.add(o);
    });
    sh.value = 9; eh.value = 18;
}
init();

function run() {
    const sMin = parseInt(document.getElementById('sh').value) * 60 + parseInt(document.getElementById('sm').value);
    let eMin = parseInt(document.getElementById('eh').value) * 60 + parseInt(document.getElementById('em').value);
    const break1 = parseFloat(document.getElementById('b1').value) * 60;
    const break2 = parseFloat(document.getElementById('b2').value) * 60;

    const LIMIT = 17 * 60; // 17:00
    const DAY_START = 5 * 60; // 05:00

    // 日またぎ対応（退勤が出勤より前なら翌日とみなす）
    if (eMin <= sMin) eMin += 24 * 60;

    // --- 区間1 (5:00 - 17:00) ---
    let p1 = Math.max(0, Math.min(eMin, LIMIT) - Math.max(sMin, DAY_START)) - break1;
    let h1 = Math.max(0, Math.floor(p1 / 15) * 0.25);

    // --- 区間2 (17:00 - 24:00以降) ---
    let p2 = Math.max(0, eMin - Math.max(sMin, LIMIT)) - break2;
    let h2 = Math.max(0, Math.floor(p2 / 15) * 0.25);

    if (h1 + h2 === 0) {
        alert("有効な勤務時間がありません。");
        return;
    }

    // 累積加算
    acc1 += h1; acc2 += h2;

    // 表示更新
    document.getElementById('g1').innerText = acc1.toFixed(2) + " 時間";
    document.getElementById('g2').innerText = acc2.toFixed(2) + " 時間";
    document.getElementById('gt').innerText = (acc1 + acc2).toFixed(2) + " 時間";

    // 履歴追加
    const hBox = document.getElementById('hist');
    if(hBox.innerText.includes("ありません")) hBox.innerHTML = "";
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span>+${(h1+h2).toFixed(2)}h</span> <small>(17時迄:${h1.toFixed(2)} / 以降:${h2.toFixed(2)})</small>`;
    hBox.prepend(item);
}

function reset() {
    if(confirm("累積データをすべて消去しますか？")) {
        acc1 = 0; acc2 = 0;
        document.getElementById('g1').innerText = "0.00 時間";
        document.getElementById('g2').innerText = "0.00 時間";
        document.getElementById('gt').innerText = "0.00 時間";
        document.getElementById('hist').innerText = "履歴はまだありません";
    }
}
</script>
</body>
</html>
