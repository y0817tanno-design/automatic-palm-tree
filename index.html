<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間帯別・勤務計算機</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; font-size: 1.2em; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        .section-title { font-weight: bold; margin-bottom: 10px; color: #007bff; border-bottom: 2px solid #007bff; display: inline-block; }
        label { display: block; margin-top: 10px; font-size: 0.9em; }
        input[type="time"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .result-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 1em; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>時間帯別 勤務計算機</h2>

    <div class="section">
        <span class="section-title">1. 勤務時間入力</span>
        <label>出勤時間</label>
        <input type="time" id="startTime" value="14:00">
        <label>退勤時間</label>
        <input type="time" id="endTime" value="22:00">
    </div>

    <div class="section">
        <span class="section-title">2. 休憩時間の設定</span>
        <label>17:00までの休憩</label>
        <select id="break1">
            <option value="0">なし</option>
            <option value="0.5">0.5時間 (30分)</option>
            <option value="1.0">1.0時間 (60分)</option>
        </select>

        <label>17:00以降の休憩</label>
        <select id="break2">
            <option value="0">なし</option>
            <option value="0.5">0.5時間 (30分)</option>
            <option value="1.0">1.0時間 (60分)</option>
        </select>
    </div>

    <button onclick="calculate()">計算を実行</button>

    <div class="result-box">
        <div class="result-item">
            <span>5:00 ～ 17:00：</span>
            <span id="res1">0.00 時間</span>
        </div>
        <div class="result-item">
            <span>17:00 ～ 0:00：</span>
            <span id="res2">0.00 時間</span>
        </div>
        <hr>
        <div class="result-item" style="color: #d9534f;">
            <span>合計勤務時間：</span>
            <span id="resTotal">0.00 時間</span>
        </div>
    </div>
</div>

<script>
function toMinutes(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
}

function calculate() {
    const startMin = toMinutes(document.getElementById('startTime').value);
    const endMin = toMinutes(document.getElementById('endTime').value);
    const break1 = parseFloat(document.getElementById('break1').value) * 60;
    const break2 = parseFloat(document.getElementById('break2').value) * 60;

    const limitMin = 17 * 60; // 17:00
    const dayStart = 5 * 60;  // 05:00

    // 区間1 (5:00 - 17:00) の計算
    let part1 = Math.min(endMin, limitMin) - Math.max(startMin, dayStart);
    part1 = Math.max(0, part1) - break1;
    if (part1 < 0) part1 = 0;

    // 区間2 (17:00 - 24:00) の計算
    let part2 = Math.max(endMin, limitMin) - Math.max(startMin, limitMin);
    part2 = Math.max(0, part2) - break2;
    if (part2 < 0) part2 = 0;

    // 15分刻み(0.25h)に切り捨て変換
    const format = (min) => (Math.floor(min / 15) * 0.25).toFixed(2);

    const h1 = format(part1);
    const h2 = format(part2);
    const total = (parseFloat(h1) + parseFloat(h2)).toFixed(2);

    document.getElementById('res1').innerText = h1 + " 時間";
    document.getElementById('res2').innerText = h2 + " 時間";
    document.getElementById('resTotal').innerText = total + " 時間";
}
</script>

</body>
</html>
